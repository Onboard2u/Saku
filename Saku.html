<body><div id="app"><header class="top"><button id="brand" class="brand" data-act="home" aria-label="Saku overview"><span class="logomark"><i></i></span>saku<span class="brand-dot">.</span></button><button class="bell iconbtn" data-act="alerts" aria-label="Open notifications"></button></header>
<main id="main" tabindex="-1"></main><nav id="nav" aria-label="Main navigation"></nav></div><div id="shade" hidden><section id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1"></section></div><div id="toast" role="status" aria-live="polite"></div><script>'use strict';
const Core = (() => {
  const pockets = ['Spend', 'Save', 'Give'];
  const openings = [18000, 6000, 1000];
  const maxAmount = 99999999;
  const clone = object => JSON.parse(JSON.stringify(object));
  function parseMoney(raw) {
    const value = String(raw).trim();
    if (!/^(?:\d{1,7})(?:\.\d{1,2})?$/.test(value)) return null;
    const [whole, fraction = ''] = value.split('.');
    const cents = Number(whole) * 100 + Number((fraction + '00').slice(0,2));
    return cents > 0 && cents <= maxAmount ? cents : null;
  }
  function amount(cents, fixed = false) {
    const n = Math.abs(cents);
    return (cents < 0 ? '−' : '') + 'RM' + (n / 100).toLocaleString('en-GB', {minimumFractionDigits: fixed || n % 100 ? 2 : 0, maximumFractionDigits: 2});
  }
  function dateOK(str) {
    if (typeof str !== 'string' || !/^20\d\d-\d\d-\d\d$/.test(str)) return false;
    const d = new Date(str + 'T12:00:00Z');
    return Number.isFinite(+d) && d.toISOString().slice(0,10) === str;
  }
  function day(date, offset) {
    const d = new Date(date + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + offset); return d.toISOString().slice(0,10);
  }
  function month(date, offset) {
    const d = new Date(date + 'T12:00:00Z');
    const n = d.getUTCDate(); d.setUTCDate(1); d.setUTCMonth(d.getUTCMonth() + offset);
    const last = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth()+1, 0)).getUTCDate();
    d.setUTCDate(Math.min(n, last)); return d.toISOString().slice(0,10);
  }
  const formatDay = (date, year = false) => new Date(date + 'T12:00:00Z').toLocaleDateString('en-GB', {day:'numeric',month:'short',...(year ? {year:'numeric'} : {}),timeZone:'UTC'});
  function today() {
    const d = new Date();
    return [d.getFullYear(), String(d.getMonth()+1).padStart(2,'0'), String(d.getDate()).padStart(2,'0')].join('-');
  }
  function defaultPlan() {
    return {name:'Everyday shoes', price:18000, start:'2026-12-04', pay:18000, payday:'2026-12-06', lateDays:5,
      essentials:[{name:'Groceries',cents:5500,date:'2026-12-05'},{name:'Household bill',cents:5500,date:'2026-12-07'},{name:'Bus fare',cents:2500,date:'2026-12-10'}]};
  }
  function seed() {
    return {version:1, entries:[], goal:{name:'Headphones',target:30000,weekly:1500}, plan:defaultPlan(), method:'three', late:false, reports:[]};
  }
  function balances(s) {
    const sums = openings.slice();
    for (const item of s.entries) {
      if (item.kind === 'income' || item.kind === 'move') sums[item.to] += item.cents;
      if (item.kind === 'expense' || item.kind === 'move') sums[item.from] -= item.cents;
    }
    return sums;
  }
  function record(s, item) {
    if (!['income','expense','move'].includes(item.kind) || !Number.isSafeInteger(item.cents) || item.cents <= 0 || item.cents > maxAmount) return 'Enter an amount from RM0.01 to RM999,999.99.';
    const debit = item.kind !== 'income', credit = item.kind !== 'expense';
    if ((debit && !pockets[item.from]) || (credit && !pockets[item.to])) return 'Choose a pocket.';
    if (item.kind === 'move' && item.from === item.to) return 'Choose two different pockets.';
    if (debit && item.cents > balances(s)[item.from]) return 'The ' + pockets[item.from] + ' pocket has only ' + amount(balances(s)[item.from]) + '.';
    if (s.entries.length >= 2000) return 'This practice wallet has reached its 2,000-entry limit.';
    if (!dateOK(item.date) || !item.note || item.note.length > 48) return 'Add a short entry name and a valid date.';
    s.entries.push({...item}); return '';
  }
  function installments(cents) {
    return [0,1,2].map(i=>Math.floor(cents/3) + (i < cents%3 ? 1 : 0));
  }
  function planError(p) {
    if (!p.name.trim() || p.name.length>48) return 'Name the purchase in 48 characters or fewer.';
    if (![p.price,p.pay].every(v=>Number.isSafeInteger(v)&&v>0&&v<=maxAmount)) return 'Enter a valid price and expected payout.';
    if (!dateOK(p.start)||!dateOK(p.payday)||p.payday<p.start) return 'Choose a payday on or after the purchase date.';
    if (!Number.isInteger(p.lateDays)||p.lateDays<1||p.lateDays>30) return 'Choose a delay of 1 to 30 days.';
    if (!p.essentials.length || p.essentials.length>8) return 'Add between one and eight essential expenses.';
    for (const e of p.essentials) if (!e.name.trim() || e.name.length>48 || !Number.isSafeInteger(e.cents)||e.cents<=0||e.cents>maxAmount||!dateOK(e.date)||e.date<p.start) return 'Each essential needs a name, amount and date on or after the purchase.';
    return '';
  }
  function project(s, method = s.method, late = s.late) {
    const p = s.plan, opening = balances(s)[0];
    const payday = late ? day(p.payday, p.lateDays) : p.payday;
    const cutoff = p.essentials.map(e=>e.date).sort().pop() || p.start;
    const events = [{date:payday,label:'Work payout',change:p.pay,type:'income',order:0}];
    p.essentials.forEach((e,i)=>events.push({date:e.date,label:e.name,change:-e.cents,type:'essential',order:1+i}));
    const buy = method === 'wait' ? payday : p.start;

function goalPanel(){
 const g=state.goal,saved=C.balances(state)[1],pct=Math.min(100,Math.floor(saved/g.target*100)),left=Math.max(0,g.target-saved),weeks=Math.ceil(left/g.weekly);
 return `<div class="card goalcard stack"><div class="split"><span class="over">Savings goal</span>${textBtn('Edit goal','goal','edit')}</div><h2 class="wrap">${esc(g.name)}</h2><div class="split"><strong class="goalnum">${money(saved)} <small>of ${money(g.target)}</small></strong><strong class="tiny">${pct}%</strong></div><div class="bar" role="progressbar" aria-label="Savings goal" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><span style="width:${pct}%"></span></div><p class="desc">${left?`At ${money(g.weekly)} a week, you have ${weeks} ${weeks===1?'week':'weeks'} to go.`:'Goal reached. Your Save pocket covers this target.'}</p>${btn('Add to savings','save-more','plus','alt')}</div>`;
}
function ledger(filter=null){
 const rows=state.entries.filter(e=>filter===null||e.from===filter||e.to===filter).slice().reverse();
 const list=rows.slice(0,25).map(e=>{
  const move=e.kind==='move',debit=e.kind==='expense'||(move&&filter===e.from),sign=debit?'−':move&&filter===null?'':'+';
  const label=move?C.pockets[e.from]+' → '+C.pockets[e.to]:C.pockets[e.kind==='income'?e.to:e.from];
  return `<div class="ledgerline"><span class="tile ${move?'save':debit?'give':'spend'}">${ic(move?'move':debit?'out':'in')}</span><div class="txt"><strong>${esc(e.note)}</strong><div class="meta">${esc(label)} · ${C.formatDay(e.date)}</div></div><span class="smallamt ${debit?'negative':sign?'positive':''}">${sign}${money(e.cents)}</span></div>`;
 }).join('');
 return (list||`<p class="empty">Your entries will appear here when you add income, record spending or move money.</p>`)+(rows.length>25?`<p class="meta">Showing the latest 25 of ${rows.length} entries.</p>`:'');
}
function wallet(){
 const b=C.balances(state),sum=b.reduce((a,v)=>a+v,0);
 return `${pageHead('Your wallet')}<div class="card walletsum"><span class="over">Total across pockets</span><div class="number">${money(sum,true)}</div><div class="bar" aria-hidden="true">${b.map((v,i)=>`<span style="width:${sum?v/sum*100:0}%;background:${['#79a985','#a091c6','#e09d7c'][i]}"></span>`).join('')}</div></div>
 ${pockets()}<div class="grid2">${btn('Add entry','add','plus')+btn('Move money','move','move','alt')}</div>${goalPanel()}<section>${sec('Recent entries')}${ledger()}</section>`;
}

function testPage(){
 const p=state.plan,r=C.project(state),first=r.first,method=state.method;
 const explanation=first?`${esc(first.label)} costs ${money(Math.abs(first.change))} on ${C.formatDay(first.date)}. You have ${money(first.balance-first.change)} available.`:`Your lowest Spend balance through ${C.formatDay(r.cutoff)} after the listed payments.`;
 const schedule=r.later.map(e=>`<li><span class="date">${C.formatDay(e.date)}</span><span class="tlbody">${esc(e.label)}</span><strong class="smallamt">${e.change>=0?'+':'−'}${money(Math.abs(e.change))}</strong></li>`).join('');
 const steps=[{date:p.start,label:'Spend pocket at start',change:null,balance:r.opening},...r.current];
 const note=method==='wait'?'Starts the three instalments when the payout arrives.':method==='three'?`First payment ${money(C.installments(p.price)[0])} on ${C.formatDay(p.start)}. Two more monthly payments follow.`:method==='skip'?'Leaves the purchase out of this plan.':`The full ${money(p.price)} is due on ${C.formatDay(p.start)}.`;
 return `${pageHead('Before You Tap','Test a purchase against your upcoming essentials.')}
 <div class="card itemcard row"><span class="tile">${ic('bag')}</span><div class="itembody"><strong>${esc(p.name)}</strong><div class="meta">${money(p.price)} · ${C.formatDay(p.start,true)}</div></div><button class="editbtn" data-act="edit-plan" aria-label="Edit scenario">${ic('edit')}</button></div>
 <div><div class="methodgrid">${Object.entries(methods).map(([k,v])=>`<button class="choice" aria-pressed="${k===method}" data-act="method" data-value="${k}">${ic(k)}${v}</button>`).join('')}</div><p class="sectionnote">${note}</p></div>
 <button class="switchrow" role="switch" aria-checked="${state.late}" data-act="delay"><span><strong>Delay payout by ${p.lateDays} days</strong><span class="meta">Payday · ${C.formatDay(r.payday,true)}</span></span><span class="switch" aria-hidden="true"><i></i></span></button>
 <div class="result ${first?'bad':''}" aria-live="polite"><span class="over">${ic(first?'alert':'check')}${first?'First shortfall':'Lowest balance'}</span><strong class="number">${money(first?Math.abs(first.balance):r.lowest)} ${first?'short':'left'}</strong><p>${explanation}</p></div>
 <section><div class="sectionhead"><h2>Cash timeline</h2><span class="meta">Through ${C.formatDay(r.cutoff)}</span></div><ul class="timeline">${steps.map(e=>`<li><span class="date">${C.formatDay(e.date)}</span><span class="tlbody"><strong>${esc(e.label)}</strong>${e.change===null?'':`<span class="change">${e.change>=0?'+':'−'}${money(Math.abs(e.change))}</span>`}</span><span class="rest ${e.balance<0?'short':''}">${money(e.balance)}</span></li>`).join('')}</ul>
 ${schedule?`<details class="inline-details"><summary>Later payments and income (${r.later.length})</summary><ul class="timeline">${schedule}</ul></details>`:''}<p class="sectionnote">Projection only. Your wallet stays the same until you record an entry.</p></section>
 ${btn('Remind me to review this plan','plan-alert','bell','alt')}`;
}
function lookupRows(){
 const a=P.search(state,query);
 return a.length?a.slice(0,24).map(r=>`<button class="reportitem" data-act="view-report" data-id="${esc(r.id)}"><span class="tile ${r.source==='Practice'?'save':'spend'}">${ic('flag')}</span><span class="words"><strong>${esc(P.familyName(r.family))}</strong><small>${esc(r.label||'Unlabelled sender')} · ${esc(r.source)}</small></span>${ic('chev')}</button>`).join('')+(a.length>24?`<p class="sectionnote">Showing 24 matches. Narrow your search to see a specific report.</p>`:''):`<p class="empty">No matching reports on this phone. An empty search cannot establish a sender’s identity.</p>`;
}
function resultBox(){
 if(!analysis)return '';
 const rel=P.related(state,analysis),flags=analysis.flags,theme=P.familyName(analysis.family);
 return `<section class="card stack" id="scan-result" tabindex="-1"><span class="over">On-device check</span><h2>${flags.length?esc(theme):'No clear warning signs found'}</h2><p class="desc">${flags.length?'The message contains these patterns.':'This small practice model can miss scams. Verify the sender independently before paying.'}</p>
 ${flags.length?`<div>${flags.map(f=>{const v=P.signals.find(x=>x.id===f);return `<div class="signal">${ic('alert')}<div><strong>${esc(v.title)}</strong><p>${esc(v.body)}</p></div></div>`;}).join('')}</div>
 <div class="banner lilac"><strong>${rel.length} related ${rel.length===1?'report':'reports'}</strong><br>${rel.length?'Similar message themes and warning signs. A match does not identify the sender.':'No saved reports share this theme and a warning sign yet.'}</div>${btn('Save a report','save-report','flag')}`:''}</section>`;
}
function protectPage(){
 return `${pageHead('Scam check','Check a message before you send money.')}<section class="card protectbox"><div class="split"><label class="over" for="message">Message to check</label>${textBtn('Try a sample','sample','down')}</div><textarea id="message" maxlength="1600" placeholder="Paste a message without private codes or account details." aria-label="Message to check">${esc(draft)}</textarea>${btn('Check message','analyse','search','full')}</section>
 ${resultBox()}<section><div class="sectionhead"><h2>Report desk</h2>${textBtn('Import code','import','download')}</div><p class="desc" style="margin-bottom:10px">Search practice and shared reports saved on this phone.</p><div class="searchwrap">${ic('search')}<input id="report-query" type="search" maxlength="50" placeholder="Search sender, number or theme" aria-label="Search reports" value="${esc(query)}"></div><div id="report-list">${lookupRows()}</div></section>`;
}
function render(enter=false){
 $('main').innerHTML=`<div class="screen ${enter?'enter':''}">${({home,wallet,test:testPage,protect:protectPage}[page])()}</div>`;
 $('nav').innerHTML=tabs.map(([key,label,icon])=>`<button data-act="${key}" class="${key===page?'active':''}" ${key===page?'aria-current="page"':''}><span class="navico">${ic(icon)}</span>${label}</button>`).join('');
 document.querySelector('.bell').innerHTML=ic('bell');document.title='Saku · '+tabs.find(t=>t[0]===page)[1];refreshBell();
}
function go(p){closeSheet(false);page=p;render(true);$('main').scrollTop=0;$('main').focus({preventScroll:true});}

function openSheet(key,title,body){
 if(!activeSheet)trigger=document.activeElement;
 activeSheet=key;
 $('sheet').innerHTML=`<div class="sheethead"><h2 id="sheet-title">${esc(title)}</h2><button type="button" class="iconbtn" data-act="close" aria-label="Close dialog">${ic('x')}</button></div>${body}`;
 $('shade').hidden=false;$('app').setAttribute('aria-hidden','true');$('sheet').scrollTop=0;$('sheet').focus({preventScroll:true});
}
function closeSheet(focus=true){
 if(!activeSheet)return;
 activeSheet='';$('shade').hidden=true;$('app').removeAttribute('aria-hidden');$('sheet').innerHTML='';
 if(focus&&trigger&&trigger.isConnected)trigger.focus({preventScroll:true});
 trigger=null;
}
const field=(title,id,value='',type='text',extra='')=>`<label class="field" for="${id}">${esc(title)}<input id="${id}" name="${id}" type="${type}" value="${esc(value)}" ${extra}></label>`;
const val=id=>$(id).value.trim();
const num=v=>(v/100).toFixed(2);
const moneyF=(title,id,v='')=>field(title,id,v,'text','inputmode="decimal" maxlength="12" autocomplete="off" placeholder="0.00" required');
const form=(key,body,submit)=>`<form id="${key}" class="form" novalidate>${body}<p id="form-error" class="error" role="alert"></p><button type="submit" class="btn full">${esc(submit)}</button></form>`;
const formErr=s=>{const el=$('form-error');if(el){el.textContent=s;el.scrollIntoView({block:'nearest'});}else toast(s);return false;};
function pocketSelect(title,id,selected){const b=C.balances(state);return `<label class="field" for="${id}">${title}<select id="${id}">${C.pockets.map((p,i)=>`<option value="${i}" ${i===selected?'selected':''}>${p} · ${money(b[i])}</option>`).join('')}</select></label>`;}
function entrySheet(kind='expense',from=0,to=1,initial={}){
 entryKind=kind;entryPocket=from;
 const move=kind==='move',segment=`<div class="seg" role="group" aria-label="Entry type">${['expense','income','move'].map(k=>`<button type="button" data-act="entry-kind" data-value="${k}" aria-pressed="${k===kind}">${{expense:'Expense',income:'Income',move:'Transfer'}[k]}</button>`).join('')}</div>`;
 let details=move?`${pocketSelect('From pocket','from',from)}${pocketSelect('To pocket','to',to)}`:pocketSelect('Pocket',kind==='income'?'to':'from',from);
 details+=moneyF('Amount (RM)','amount',initial.amount||'')+field(move?'Note (optional)':'Entry name','note',initial.note||'','text',`maxlength="48" placeholder="${move?'Pocket transfer':kind==='expense'?'e.g. Lunch':'e.g. Weekend work'}"`);
 openSheet('entry',move?'Move money':'Add an entry',form('entry-form',segment+details,move?'Move money':'Save entry'));
}
function goalSheet(){const g=state.goal;openSheet('goal','Savings goal',form('goal-form',field('What are you saving for?','goal-name',g.name,'text','maxlength="48" required')+moneyF('Target (RM)','goal-target',num(g.target))+moneyF('Weekly contribution (RM)','goal-weekly',num(g.weekly))+`<p class="meta">Progress uses the current balance in your Save pocket.</p>`,'Save goal'));}
function billRow(e){return `<div class="billrow"><div class="split"><label class="field">Essential<input class="bill-name" maxlength="48" value="${esc(e.name)}" placeholder="e.g. Bus fare"></label><button type="button" class="minor" data-act="remove-bill">Remove</button></div><div class="grid2"><label class="field">Amount (RM)<input class="bill-amount" inputmode="decimal" maxlength="12" value="${e.cents?num(e.cents):''}" placeholder="0.00"></label><label class="field">Due date<input class="bill-date" type="date" value="${esc(e.date)}"></label></div></div>`;}
function planSheet(){
 const p=state.plan;
 const details=field('Purchase name','item-name',p.name,'text','maxlength="48"')+`<div class="grid2">${moneyF('Price (RM)','price',num(p.price))}${field('Purchase date','start',p.start,'date')}</div><div class="grid2">${moneyF('Payout (RM)','pay',num(p.pay))}${field('Expected payday','payday',p.payday,'date')}</div>${field('Days late to test','late-days',String(p.lateDays),'number','min="1" max="30" inputmode="numeric"')}<fieldset><legend>Essential expenses</legend><div class="stack" id="bills">${p.essentials.map(billRow).join('')}</div></fieldset>${btn('Add essential','add-bill','plus','alt')}<p class="meta">Opening cash comes from Spend. On the same date, the simulator applies income, then essentials, then the purchase.</p>`;
 openSheet('plan','Edit scenario',form('plan-form',details,'Update simulation'));
}
function pocketSheet(i){
 entryPocket=i;
 openSheet('pocket',C.pockets[i]+' pocket',`<div class="stack"><div class="number">${money(C.balances(state)[i],true)}</div><p class="desc">${['Available for everyday spending and the purchase simulator.','Set aside for your savings goal.','Set aside for contributions and giving.'][i]}</p>${btn('Add an entry','pocket-add','plus')}<h3>Recent entries</h3><div>${ledger(i)}</div></div>`);
}
function sampleSheet(){openSheet('sample','Choose a practice message',`<div class="tools">${Object.keys(P.samples).map(k=>`<button class="feature" data-act="pick-sample" data-value="${k}"><span class="tile save">${ic('flag')}</span><span class="words"><strong>${esc(P.familyName(k))}</strong><small>${esc(P.samples[k].slice(0,56))}…</small></span>${ic('chev')}</button>`).join('')}</div>`);}
function saveReportSheet(){
 openSheet('report-save','Save a report',form('report-form',`<div class="banner lilac"><strong>${esc(P.familyName(analysis.family))}</strong><br>${analysis.flags.length} warning signs in this message.</div>${field('Sender label or demo number','report-label','','text','maxlength="32" placeholder="e.g. Shoe Shop F"')}<p class="meta">Only the label, theme and warning signs are saved. Use a fictional label for your pitch. The original message stays out of the report.</p>`,'Save on this phone'));
}
function reportSummary(r){return `<div class="stack"><span class="over">Unverified report · ${esc(r.source)}</span><h3>${esc(P.familyName(r.family))}</h3><p class="desc">Sender label: ${esc(r.label||'Not supplied')}</p><div>${r.flags.map(f=>`<div class="signal">${ic('flag')}<div><strong>${esc(P.signals.find(x=>x.id===f).title)}</strong></div></div>`).join('')}</div></div>`;}
function reportSheet(r){
 selectedReport=r;
 openSheet('report','Report details',`<div class="stack">${reportSummary(r)}<p class="meta">A reported sender label may be spoofed. This card records a message pattern.</p>${btn('Share report','share-report','share')+btn('Show report code','show-code','link','alt')}</div>`);
}
function codeSheet(){const code=P.card(selectedReport);openSheet('code','Report code',`<div class="form"><p class="desc">On a second phone, open Protect → Import code. The code carries this report’s label and warning signs.</p><label class="field">Code<textarea id="report-code" readonly rows="4">${esc(code)}</textarea></label>${btn('Copy code','copy-code','share')}</div>`);}
function importSheet(data=''){imported=null;openSheet('import','Import report',form('import-form',`<label class="field">Report code<textarea id="import-code" rows="4" maxlength="2200" placeholder="SAKU1.…">${esc(data)}</textarea></label>`,'Preview report'));}
function previewImport(r){imported=r;openSheet('import-preview','Review shared report',`<div class="stack">${reportSummary(r)}<p class="meta">Shared reports remain unverified. Importing makes the label searchable on this phone.</p>${btn('Import this report','accept-import','download')}</div>`);}
function notifyState(){try{return phone?JSON.parse(phone.notificationState()):{access:'preview',due:0};}catch(e){return {access:'unavailable',due:0};}}
function refreshBell(){const el=document.querySelector('.bell');if(el)el.classList.toggle('scheduled',notifyState().due>0);}
function alerts(route=alertRoute){
 alertRoute=route;const n=notifyState(),blocked=n.access==='blocked',native=!!phone;
 const p=state.plan,g=state.goal;
 const choices=`<div class="seg" role="group" aria-label="Reminder topic"><button type="button" data-act="topic-wallet" aria-pressed="${route==='wallet'}">Savings goal</button><button type="button" data-act="topic-test" aria-pressed="${route==='test'}">Purchase plan</button></div>`;
 const timing=`<div class="grid2">${btn('Send now','send-now','bell')+btn('In 10 seconds','send-later','wait','alt')}</div>${btn('Remind me tomorrow','send-tomorrow','wait','alt')}`;
 const status=n.due>0?`<div class="banner"><strong>Reminder scheduled</strong><br>${esc(new Date(n.due).toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}))} · ${n.route==='test'?'Purchase plan':'Savings goal'}<br>${textBtn('Cancel reminder','cancel-alert')}</div>`:'';
 openSheet('alerts','Phone reminders',`<div class="form">${choices}<div class="banner lilac"><strong>${esc(route==='wallet'?'Savings check-in':'Review your purchase plan')}</strong><br>${esc(route==='wallet'?g.name+' · '+money(C.balances(state)[1])+' of '+money(g.target):p.name+' · '+methods[state.method])}</div>
 <p class="desc">${blocked?'Notifications are switched off. Enable Saku alerts in Android settings to receive this reminder.':native?'Tap the notification in your phone’s tray to reopen the selected goal or plan.':'Android notifications are available in the installed Saku APK.'}</p>${status}
 ${blocked?btn('Open notification settings','notification-settings','bell'):native?timing:''}
 ${native&&!blocked?'<p class="meta">Try the 10-second reminder, then press Home. Tomorrow’s reminder can be delayed by Android battery settings.</p>':''}</div>`);
}
function settingsSheet(){openSheet('settings','Practice settings',`<div class="form"><p class="desc">Saku stores your practice wallet and reports on this phone. The message checker uses a small offline model trained on fictional English and Malay examples.</p>${btn('Phone reminders','alerts','bell','alt')+btn('Reset practice data','reset-confirm','reset','warn')}</div>`);}
function resetSheet(){openSheet('reset','Reset practice data?',`<div class="form"><p class="desc">This clears your entries, saved reports, scenario edits and pending reminder. It restores RM180 in Spend, RM60 in Save and RM10 in Give.</p>${btn('Reset this practice wallet','reset-now','reset','warn')+btn('Keep my data','close','','alt')}</div>`);}

function saveAndClose(next,msg){
 if(!commit(next))return false;closeSheet(false);render();toast(msg);return true;
}
function submitForm(event){
 event.preventDefault();const name=event.target.id,next=C.clone(state);
 if(name==='entry-form'){
  const from=$('from')?Number(val('from')):null,to=$('to')?Number(val('to')):null;
  const item={kind:entryKind,from,to,cents:C.parseMoney(val('amount')),note:val('note')||(entryKind==='move'?'Pocket transfer':''),date:C.today()};
  const error=C.record(next,item);if(error)return formErr(error);
  return saveAndClose(next,entryKind==='move'?'Money moved between pockets.':'Entry saved.');
 }
 if(name==='goal-form'){
  const g={name:val('goal-name'),target:C.parseMoney(val('goal-target')),weekly:C.parseMoney(val('goal-weekly'))};
  if(!g.name||!g.target||!g.weekly)return formErr('Enter a goal name, a positive target and a weekly contribution.');
  next.goal=g;return saveAndClose(next,'Savings goal updated.');
 }
 if(name==='plan-form'){
  const plan={name:val('item-name'),price:C.parseMoney(val('price')),pay:C.parseMoney(val('pay')),start:val('start'),payday:val('payday'),lateDays:Number(val('late-days')),essentials:Array.from(document.querySelectorAll('.billrow'),r=>({name:r.querySelector('.bill-name').value.trim(),cents:C.parseMoney(r.querySelector('.bill-amount').value),date:r.querySelector('.bill-date').value}))};
  const err=C.planError(plan);if(err)return formErr(err);next.plan=plan;return saveAndClose(next,'Scenario updated.');
 }
 if(name==='report-form'){
  if(!analysis||draft!==checkedText)return formErr('Check the message again.');
  const label=val('report-label');if(!label)return formErr('Add a sender label, such as Shoe Shop F.');
  const r=P.make(analysis,label),err=P.add(next,r);if(err)return formErr(err);
  if(commit(next)){render();reportSheet(r);toast('Report saved on this phone.');}return;
 }
 if(name==='import-form'){try{previewImport(P.readCard(val('import-code')));}catch(e){formErr(e.message);}return;}
}
function changeScenario(k,v){const n=C.clone(state);n[k]=v;if(commit(n))render();}
function sendReminder(seconds){
 if(!phone)return;const r=C.project(state),test=alertRoute==='test',title=test?'Review your purchase plan':'Savings check-in';
 const message=test?state.plan.name+' · '+(r.first?money(Math.abs(r.first.balance))+' short on '+C.formatDay(r.first.date):'lowest balance '+money(r.lowest))+' in your saved scenario.':state.goal.name+' · '+money(C.balances(state)[1])+' of '+money(state.goal.target)+' saved. Open your wallet to check in.';
 phone.remind(alertRoute,title,message,seconds);
}
function showReport(id){const r=P.all(state).find(x=>x.id===id);if(r)reportSheet(r);}
function shareReport(){const code=P.card(selectedReport);if(phone){phone.shareCard(code);return;}if(navigator.share){navigator.share({text:code}).catch(()=>{});}else codeSheet();}
function copyCode(){const code=$('report-code').value;if(phone){phone.copyCard(code);return;}const a=$('report-code');a.select();try{toast(document.execCommand('copy')?'Report code copied.':'Select and copy the code.');}catch(e){toast('Select and copy the code.');}}
const actions={
 home:()=>go('home'),wallet:()=>go('wallet'),test:()=>go('test'),protect:()=>go('protect'),close:()=>closeSheet(),
 add:()=>entrySheet(),move:()=>entrySheet('move'), 'save-more':()=>entrySheet('move',0,1,{note:'Savings contribution'}),
 pocket:b=>pocketSheet(Number(b.dataset.i)), 'pocket-add':()=>entrySheet('expense',entryPocket),
 'entry-kind':b=>{const k=b.dataset.value,prevFrom=$('from')?Number(val('from')):Number(val('to')),oldTo=$('to')?Number(val('to')):(prevFrom+1)%3;entrySheet(k,prevFrom,oldTo===prevFrom?(prevFrom+1)%3:oldTo,{amount:val('amount'),note:val('note')});},
 goal:goalSheet,'edit-plan':planSheet,'add-bill':()=>{if(document.querySelectorAll('.billrow').length>=8)return formErr('Eight essentials is the maximum for this prototype.');$('bills').insertAdjacentHTML('beforeend',billRow({name:'',cents:0,date:val('start')}));},
 'remove-bill':b=>{if(document.querySelectorAll('.billrow').length===1)return formErr('Keep at least one essential expense.');b.closest('.billrow').remove();},
 method:b=>changeScenario('method',b.dataset.value),delay:()=>changeScenario('late',!state.late),
 sample:sampleSheet,'pick-sample':b=>{draft=P.samples[b.dataset.value];analysis=null;closeSheet(false);render();},
 analyse:()=>{draft=$('message').value.trim();if(draft.length<8){toast('Enter a message of at least eight characters.');$('message').focus();return;}checkedText=draft;analysis=P.classify(draft);render();$('scan-result').scrollIntoView({block:'start'});$('scan-result').focus({preventScroll:true});},
 'save-report':()=>{if(analysis&&analysis.flags.length&&checkedText===draft)saveReportSheet();},'view-report':b=>showReport(b.dataset.id),
 'share-report':shareReport,'show-code':codeSheet,'copy-code':copyCode,import:()=>importSheet(),
 'accept-import':()=>{if(!imported)return;const n=C.clone(state),err=P.add(n,imported);if(err){toast(err);return;}if(commit(n)){query=imported.label;go('protect');toast('Report imported and searchable.');}},
 alerts:()=>alerts(page==='test'?'test':'wallet'),'plan-alert':()=>alerts('test'),'topic-wallet':()=>alerts('wallet'),'topic-test':()=>alerts('test'),
 'send-now':()=>sendReminder(0),'send-later':()=>sendReminder(10),'send-tomorrow':()=>sendReminder(86400),
 'cancel-alert':()=>{if(phone)phone.cancelReminder();},'notification-settings':()=>{if(phone)phone.showNotificationSettings();},
 settings:settingsSheet,'reset-confirm':resetSheet,'reset-now':()=>{if(!commit(C.seed()))return;if(phone)phone.clearReminders();draft='';analysis=null;checkedText='';query='';selectedReport=null;imported=null;go('home');toast('Original practice wallet restored.');}
};
document.addEventListener('click',event=>{if(event.target===$('shade')){closeSheet();return;}const b=event.target.closest('[data-act]');if(b&&actions[b.dataset.act])actions[b.dataset.act](b);});
document.addEventListener('submit',submitForm);
document.addEventListener('input',e=>{
 if(e.target.id==='report-query'){query=e.target.value;$('report-list').innerHTML=lookupRows();}
 if(e.target.id==='message'){draft=e.target.value;if(draft!==checkedText){analysis=null;const el=$('scan-result');if(el)el.remove();}}
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){if(window.sakuBack())e.preventDefault();}
 if(e.key==='Tab'&&activeSheet){const focusable=Array.from($('sheet').querySelectorAll('button:not(:disabled),input,select,textarea,summary'));if(!focusable.length)return;const first=focusable[0],last=focusable[focusable.length-1];if(e.shiftKey&&(document.activeElement===first||document.activeElement===$('sheet'))){last.focus();e.preventDefault();}else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}}
});
window.sakuBack=()=>{if(activeSheet){closeSheet();return true;}if(page!=='home'){go('home');return true;}return false;};
window.sakuRefresh=()=>{refreshBell();if(activeSheet==='alerts')alerts(alertRoute);};
window.sakuNotify=message=>{window.sakuRefresh();if(message)toast(message);};
window.sakuHandleLaunch=()=>{
 if(!phone)return;let x;try{x=JSON.parse(phone.takeLaunch()||'{}');}catch(e){return;}
 if(x.route==='import'){go('protect');try{previewImport(P.readCard(x.text||''));}catch(e){importSheet(x.text||'');formErr(e.message);}return;}
 if(tabs.some(t=>t[0]===x.route)){
  go(x.route);
  if(x.route==='wallet')document.querySelector('.goalcard').scrollIntoView({block:'start'});
 }
};
render();window.sakuHandleLaunch();
</script></body></html>
